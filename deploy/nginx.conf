# Dark Start on nginx. Adjust server_name, root and certificate paths.

# --- goes in the http { } block ---------------------------------------------
# One Cache-Control value per file type, set without location blocks
# (an add_header inside a location would silently drop the security headers below).
map $uri $darkstart_cache {
    ~*\.json$                          "no-cache";
    ~*\.(css|js|jpg|jpeg|png|webp|svg)$ "max-age=3600";
    default                            "";
}

# --- redirects: one address only (https, no www) ------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.org www.example.org;
    return 301 https://example.org$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.org;
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    return 301 https://example.org$request_uri;
}

# --- the site -----------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.org;
    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    root /var/www/darkstart;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;   # remove if you want the site listed
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $darkstart_cache always;

    # Keep repository files out of view if the whole repo is deployed.
    location ~ ^/(docs|deploy|\.github|\.git)(/|$)                     { return 404; }
    location ~ ^/(README\.md|CHANGELOG\.md|CONTRIBUTING\.md|SECURITY\.md|LICENSE|web\.config|\.htaccess)$ { return 404; }
}
